name: 🧪 CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Only keep the newest run for a given branch/PR; a new push cancels the stale build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 🏗️ Install · Generate · Build · Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: 🧶 Enable Corepack
        # Installs the Yarn version pinned by the "packageManager" field (yarn@4.1.1)
        run: corepack enable

      - name: 📦 Install dependencies
        run: yarn install --immutable

      - name: 🔧 Generate Prisma client
        run: yarn workspace @safestorage/backend generate

      - name: 🏗️ Build (turbo)
        run: yarn build

      - name: 🔎 Typecheck frontend
        # next.config.mjs sets `typescript.ignoreBuildErrors`, so an explicit
        # typecheck is the only thing gating the Next.js app at build time.
        run: yarn workspace @safestorage/next typecheck

      - name: 🧹 Lint backend
        run: yarn workspace @safestorage/backend lint
