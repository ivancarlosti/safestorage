# SafeStorage - pull-only deployment
#
# This compose file never builds anything: it runs the single combined image
# (nginx + backend + frontend) published to GitHub Container Registry.
#
#   cp .env.example .env   # then edit it
#   docker compose pull
#   docker compose up -d
#
# The database is NOT part of this stack: `DATABASE_URL` points at a MariaDB/MySQL
# server you run yourself (see `.env.example`). Only `./uploads` and `./logs` live
# next to this file. If you would rather have the database shipped for you, use
# `docker-compose-bundle.yml` instead.

services:
  safestorage:
    image: ghcr.io/ivancarlosti/safestorage:${SAFESTORAGE_TAG:-latest}
    container_name: safestorage
    restart: unless-stopped
    # Give running uploads time to finish writing before the container stops.
    stop_grace_period: 2m
    extra_hosts:
      # Makes `host.docker.internal` resolve to the Docker host on Linux too, so
      # the same DATABASE_URL reaches a database running on the host from any
      # platform.
      - 'host.docker.internal:host-gateway'
    ports:
      # Everything (frontend, /api, /docs, uploads) is served from port 80
      # inside the container; only this single port is published.
      - '${SAFESTORAGE_PORT:-24424}:80'
    environment:
      # Password of the automatically created admin user (first boot only).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # MariaDB/MySQL connection string, shared by the backend and the migrations.
      # The `:?` makes `docker compose up` fail with a clear message instead of
      # starting a container that cannot reach its database.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in your .env file}
      # Used for the timestamps in the container logs.
      TZ: ${TZ:-UTC}
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      # /api/health is the backend (through nginx), / is the Next.js frontend.
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1/api/health > /dev/null && wget -qO- http://127.0.0.1/ > /dev/null'
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
