; SafeStorage combined container
;
; supervisord keeps the three long running processes of the image alive:
;   backend  - Fastify API + uploads + thumbnails (node dist/main.js)
;   frontend - Next.js standalone server (node packages/next/server.js)
;   nginx    - reverse proxy / static file server
;
; Every process logs to stdout/stderr so `docker logs safestorage` is complete.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=info

[program:backend]
command=node dist/main.js
directory=/app/packages/backend
environment=NODE_ENV="production",PORT="8000",HOST="0.0.0.0"
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:frontend]
command=node packages/next/server.js
directory=/app/frontend
environment=NODE_ENV="production",PORT="8001",HOSTNAME="0.0.0.0"
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
startretries=10
stopwaitsecs=10
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
