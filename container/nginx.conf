# SafeStorage combined container
#
# Single nginx instance that fronts the whole application:
#   /api/*, /docs  -> Fastify backend      (127.0.0.1:8000)
#   existing files -> /app/uploads         (uploads, /thumbs, /live, /zips)
#   anything else  -> Next.js frontend     (127.0.0.1:8001)
#
# Replaces the Caddyfile used by the old three-container setup. TLS is
# terminated in front of this container, so only plain HTTP is served here.

user root; # the container is the security boundary; workers must read /app/uploads
worker_processes auto;
# Docker's default soft limit (1024) is lower than `worker_connections` below,
# which makes nginx complain at startup.
worker_rlimit_nofile 8192;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
	worker_connections 4096;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	access_log /dev/stdout combined;

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 75;
	server_tokens off;
	types_hash_max_size 4096;

	# Uploads larger than 2 GB must stream straight through this proxy:
	# never cap the body size, never buffer the body to disk or memory.
	client_max_body_size 0;
	client_body_timeout 600s;
	client_header_timeout 600s;
	send_timeout 600s;

	proxy_http_version 1.1;
	proxy_request_buffering off;
	proxy_buffering off;
	proxy_connect_timeout 60s;
	proxy_send_timeout 600s;
	proxy_read_timeout 600s;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header Connection "";

	upstream safestorage_backend {
		server 127.0.0.1:8000;
		keepalive 32;
	}

	upstream safestorage_frontend {
		server 127.0.0.1:8001;
		keepalive 32;
	}

	server {
		listen 80 default_server;
		server_name _;

		# The Fastify API. No URI on proxy_pass so the path is preserved as-is.
		location /api/ {
			proxy_pass http://safestorage_backend;
		}

		# Scalar/OpenAPI reference served by Fastify.
		location /docs {
			proxy_pass http://safestorage_backend;
		}

		# The home page is always rendered by Next.js, even if a directory
		# called "/" exists inside the uploads folder.
		location = / {
			proxy_pass http://safestorage_frontend;
		}

		# Uploaded files, thumbnails (/thumbs), live videos (/live) and
		# generated zips (/zips) are served straight off disk. Range requests
		# (video seeking, resumed downloads) are handled natively by nginx.
		location / {
			root /app/uploads;
			try_files $uri @frontend;
		}

		location @frontend {
			proxy_pass http://safestorage_frontend;
		}
	}
}
