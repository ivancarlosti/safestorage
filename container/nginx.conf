# SafeStorage combined container
#
# Single nginx instance that fronts the whole application:
#   /api/*, /docs  -> Fastify backend      (127.0.0.1:8000)
#   existing files -> /app/uploads         (uploads, /thumbs, /live, /zips)
#   anything else  -> Next.js frontend     (127.0.0.1:8001)
#
# Replaces the Caddyfile used by the old three-container setup. TLS is
# terminated in front of this container, so only plain HTTP is served here.

user root; # the container is the security boundary; workers must read /app/uploads
worker_processes auto;
# Docker's default soft limit (1024) is lower than `worker_connections` below,
# which makes nginx complain at startup.
worker_rlimit_nofile 8192;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
	worker_connections 4096;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	access_log /dev/stdout combined;

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 75;
	server_tokens off;
	types_hash_max_size 4096;

	# Uploads larger than 2 GB must stream straight through this proxy:
	# never cap the body size, never buffer the body to disk or memory.
	client_max_body_size 0;
	client_body_timeout 600s;
	client_header_timeout 600s;
	send_timeout 600s;

	proxy_http_version 1.1;
	proxy_request_buffering off;
	proxy_buffering off;
	proxy_connect_timeout 60s;
	proxy_send_timeout 600s;
	proxy_read_timeout 600s;
	# The backend builds the absolute upload links from the Host header, so it
	# has to keep the port the visitor used: `$host` drops it, and the bundle
	# publishes the container on a non-80 port (24424 by default), which would
	# make every file/thumbnail URL point at port 80 and fail to load.
	proxy_set_header Host $http_host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host $http_host;
	proxy_set_header Connection "";

	upstream safestorage_backend {
		server 127.0.0.1:8000;
		keepalive 32;
	}

	upstream safestorage_frontend {
		server 127.0.0.1:8001;
		keepalive 32;
	}

	server {
		listen 80 default_server;
		server_name _;

		# The Fastify API. No URI on proxy_pass so the path is preserved as-is.
		location /api/ {
			proxy_pass http://safestorage_backend;
		}

		# Scalar/OpenAPI reference served by Fastify.
		location /docs {
			proxy_pass http://safestorage_backend;
		}

		# Albums published as static websites (path mode). The backend applies
		# the sandbox/CSP headers itself, so nothing is added here: proxied
		# response headers reach the browser unchanged.
		location /site/ {
			proxy_pass http://safestorage_backend;
		}

		# `/site` is the storage folder of the website albums inside
		# /app/uploads, never a page. The entry points are /site/{identifier}/
		# (and the 8080 listener below); matching the folder here would answer
		# it as a directory of the uploads root and expose the storage layout.
		location = /site {
			return 404;
		}

		# The home page is always rendered by Next.js, even if a directory
		# called "/" exists inside the uploads folder.
		location = / {
			proxy_pass http://safestorage_frontend;
		}

		# Uploaded files, thumbnails (/thumbs), live videos (/live) and
		# generated zips (/zips) are served straight off disk. Range requests
		# (video seeking, resumed downloads) are handled natively by nginx.
		#
		# Everything under /app/uploads is untrusted content that keeps the
		# extension the uploader picked, so an uploaded .html or .svg opens as a
		# document on this very origin, where its script could call /api with the
		# token cookie of whoever follows the link (GHSA-7hmq-gf2f-c9c9). The
		# sandbox policy moves the document to an opaque origin with scripts,
		# plugins and forms disabled, and `nosniff` stops a file from being
		# re-interpreted as HTML. The CORS header keeps native media viewers able
		# to fetch the file from that opaque origin.
		#
		# Keep these values in sync with packages/backend/src/utils/UploadSecurity.ts,
		# which the backend's dev static server uses in place of this location.
		# The fallback to @frontend does not inherit them, so the application
		# itself is neither sandboxed nor opened to other origins.
		location / {
			root /app/uploads;
			add_header Content-Security-Policy "sandbox; script-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" always;
			add_header X-Content-Type-Options "nosniff" always;
			add_header Access-Control-Allow-Origin "*" always;
			try_files $uri @frontend;
		}

		location @frontend {
			proxy_pass http://safestorage_frontend;
		}
	}

	# Per-site website listener (domain mode).
	#
	# The backend answers `{identifier}.{hostingDomain}` by reading the Host
	# header, so this server block is a plain proxy with no routing of its own.
	# It is published on 8080 and meant to sit behind the operator's TLS
	# terminator: put the wildcard certificate there and point the wildcard DNS
	# record (*.sites.example.com) at port 8080. Nothing is served here unless
	# website hosting is enabled in the settings and a link opts in.
	server {
		listen 8080;
		server_name _;

		location / {
			proxy_pass http://safestorage_backend;
		}
	}
}
